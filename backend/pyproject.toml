[project]
name = "agent-arena-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "appwrite~=22.2",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.0.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.5.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "deepeval"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
arena-targets = "agent_arena.targets_cli:main"

[tool.setuptools.packages.find]
include = ["agent_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"agent_arena.skills" = ["*.yaml"]
