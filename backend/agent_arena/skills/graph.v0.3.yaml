version: 0.3.0
roots:
  strategy: Reasoning approaches for diagnosis, repair, evidence, and replanning.
  investigation: Repository, dependency, authority, history, configuration, and external
    research.
  debugging: Failure diagnosis across traces, state, concurrency, async flow, reproduction,
    and edge cases.
  testing: Visible-test understanding, regression design, verification, and harness
    expertise.
  runtime: Execution environments, dependencies, packages, processes, sandboxes, workspaces,
    and documentation.
  build: Node/package builds, Make, compilers/linkers, and incremental build behavior.
  backend: APIs, authentication, authorization, sessions, and application state machines.
  data: SQL, schemas, migrations, transactions, and data integrity.
  security: Trust boundaries, execution, filesystem, auth, validation, injection,
    replay, and adversarial analysis.
  artifacts: Mutable workspaces, immutable versions, and handoff boundaries.
  observability: Traces, runtime events, and realtime execution streams.
  interface: Frontend, browser-visible behavior, and terminal/execution interfaces.
  roles: Builder and breaker perspectives without restricting general fighter access.
