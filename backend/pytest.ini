[pytest]
markers =
    modal: real Modal Sandbox integration (skipped by default; run with -m modal)
    integration: external Appwrite / paid provider / live HTTP (needs ARENA_INTEGRATION_TESTS=1)
    postgres: real PostgreSQL (requires ARENA_INTEGRATION_TESTS=1 and ARENA_PG_TEST_URL)
    provider_eval: paid/provider LLM evals (deepeval)
addopts = -m "not modal and not integration and not postgres and not provider_eval"
